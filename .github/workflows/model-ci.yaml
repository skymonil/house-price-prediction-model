
name: Model CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/train.py"
      - "src/preprocess.py"
      - "src/evaluate.py"
      - "src/model_ci.py"
      - "data/houses.csv"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/train.py"
      - "src/preprocess.py"
      - "src/evaluate.py"
      - "src/model_ci.py"
      - "data/houses.csv"

  workflow_dispatch:

jobs:
  model-quality:
    name: Train and Validate Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and evaluate model
        run: |
          python -m src.model_ci

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: house-price-model-${{ github.sha }}
          path: |
            models/model_ci.pkl
            models/metrics.json
          retention-days: 7