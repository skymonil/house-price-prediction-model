# model_ci.yaml
name: Model CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "metadata/**"
      - "requirements.txt"
      - ".github/workflows/model_ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "metadata/**"
      - "requirements.txt"
      - ".github/workflows/model_ci.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-quality:
    name: Test, Train and Validate Model
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      # Only push to main or manual execution on main can register.
      # Pull requests and manual runs on other branches cannot register.
      REGISTER_MODEL: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # Stage 1: Run automated tests before model training.
      # A non-zero pytest exit code stops the job.
      - name: Run automated tests
        run: |
          python -m pytest -v

      # Stage 2: Train and evaluate the candidate.
      # model_ci.py must honor REGISTER_MODEL before registering anything.
      - name: Train and evaluate model
        run: |
          python -m src.model_ci

      - name: Verify model artifacts
        run: |
          test -f models/model_ci.pkl || {
            echo "Missing models/model_ci.pkl"
            exit 1
          }

          test -f models/metrics.json || {
            echo "Missing models/metrics.json"
            exit 1
          }

      # Stage 3: Registration is allowed only for approved workflow events.
      - name: Verify candidate version
        if: env.REGISTER_MODEL == 'true'
        run: |
          test -s models/candidate_version.txt || {
            echo "Candidate registration did not produce models/candidate_version.txt"
            exit 1
          }

      # Stage 4: Compare the registered candidate against the champion.
      - name: Compare candidate against champion
        if: env.REGISTER_MODEL == 'true'
        run: |
          candidate_version="$(tr -d '[:space:]' < models/candidate_version.txt)"

          if [ -z "$candidate_version" ]; then
            echo "Candidate version is empty"
            exit 1
          fi

          echo "Candidate version: $candidate_version"

          python -m src.compare_models \
            --candidate-version "$candidate_version"

      # Preserve diagnostic artifacts even if an earlier step fails.
      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-price-model-${{ github.sha }}
          path: |
            models/model_ci.pkl
            models/metrics.json
            models/candidate_version.txt
            reports/comparison-*.json
          if-no-files-found: warn
          retention-days: 7