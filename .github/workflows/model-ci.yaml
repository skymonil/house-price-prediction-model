
name: Model CI

on:
  push:
    branches:
      - main
    paths:
      - "src/train.py"
      - "src/preprocess.py"
      - "src/evaluate.py"
      - "src/model_ci.py"
      - "data/houses.csv"
      - "requirements.txt"
      - ".github/workflows/model_ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "src/train.py"
      - "src/preprocess.py"
      - "src/evaluate.py"
      - "src/model_ci.py"
      - "data/houses.csv"
      - "requirements.txt"
      - ".github/workflows/model_ci.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-quality:
    name: Train and Validate Model
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and evaluate model
        run: |
          python -m src.model_ci

      - name: Verify model artifacts
        run: |
          test -f models/model_ci.pkl || {
            echo "Missing models/model_ci.pkl"
            exit 1
          }

          test -f models/metrics.json || {
            echo "Missing models/metrics.json"
            exit 1
          }

      # Candidate registration must happen only after quality gates pass.
  # src.model_ci must write this file after successful registratio
      
      - name: Verify candidate version
        if: github.event_name != 'pull_request'
        run: |
          test -s models/candidate_version.txt || {
            echo "Candidate registration did not produce models/candidate_version.txt"
            exit 1
          }
      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-price-model-${{ github.sha }}
          path: |
            models/model_ci.pkl
            models/metrics.json
            models/candidate_version.txt
          if-no-files-found: warn
          retention-days: 7
