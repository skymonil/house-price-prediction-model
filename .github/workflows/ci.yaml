
name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # 1. Run application tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  # 2. Build and publish Docker image
  docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: skymonil/house-price-api:${{ github.sha }}

  # 3. Update dev GitOps workload after a develop push
  update-gitops:
    name: Update Dev GitOps Image
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: skymonil/event-microservice-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update House Price API image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/workloads/dev/house-price-api/values.yaml")

          if not path.exists():
              raise SystemExit(f"GitOps values file not found: {path}")

          content = path.read_text()

          # Update the image tag under microservice.image only.
          pattern = r'(?ms)(^microservice:\s*\n.*?^\s{2}image:\s*\n.*?^\s{4}tag:\s*)("[^"]*"|[^\s#]+)(\s*(?:#.*)?)$'

          updated, count = re.subn(
              pattern,
              lambda m: f'{m.group(1)}"{os.environ["IMAGE_TAG"]}"{m.group(3)}',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not find microservice.image.tag in values.yaml"
              )

          path.write_text(updated)
          PY

      - name: Commit and push GitOps change
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add workloads/dev/house-price-api/values.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "Deploy house-price-api ${{ github.sha }}"
          git push origin main
