
name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: skymonil/house-price-api

jobs:
  # 1. Run application tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  # 2. Build the image and publish it on branch pushes
  docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 3. Update dev only after a successful push to develop
  update-dev-gitops:
    name: Update Dev GitOps Image
    runs-on: ubuntu-latest
    needs: docker

    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: skymonil/house-price-prediction-model-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update dev image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(
              "gitops/environments/dev/values/house-price-api.yaml"
          )

          if not path.is_file():
              raise SystemExit(f"GitOps values file not found: {path}")

          lines = path.read_text().splitlines(keepends=True)

          inside_image = False
          updated = False
          result = []

          image_tag = os.environ["IMAGE_TAG"]

          for line in lines:
              # Find the top-level image block.
              if line.startswith("image:"):
                  inside_image = True
                  result.append(line)
                  continue

              # Stop when the next top-level YAML key begins.
              if (
                  inside_image
                  and line.strip()
                  and not line[0].isspace()
                  and not line.lstrip().startswith("#")
              ):
                  inside_image = False

              # Update only image.tag, preserving comments and formatting.
              if inside_image and re.match(r"^  tag:\s*", line):
                  line, count = re.subn(
                      r'^(\s*tag:\s*)(?:"[^"]*"|\'[^\']*\'|[^\s#]+)',
                      lambda m: f'{m.group(1)}"{image_tag}"',
                      line,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit("Could not update image.tag")

                  updated = True

              result.append(line)

          if not updated:
              raise SystemExit(
                  f"Could not find image.tag in {path}"
              )

          path.write_text("".join(result))
          print(f"Updated dev image tag to {image_tag}")
          PY

      - name: Commit and push GitOps change
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add environments/dev/values/house-price-api.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "Deploy house-price-api ${{ github.sha }}"
          git push origin main
